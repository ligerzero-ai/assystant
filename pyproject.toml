[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assystant"
dynamic = ["version"]
description = "Command-line driver for ASSYST campaigns: PyXtal generation -> per-structure DFT on SLURM -> collated training dataset"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Han Lin Mai" }]
keywords = ["assyst", "vasp", "dft", "pyxtal", "slurm", "machine-learning-potentials"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyiron_workflow>=0.19,<0.20",
    "flowrep>=0.6,<0.7",
    "pyiron_workflow_assyst>=0.2.0",
    "pyiron_workflow_vasp>=0.2.0",
    "pyxtal>=1.0",
    "pymatgen>=2023.0.0",
    "ase>=3.22.0",
    "pandas>=1.3.0",
    "PyYAML>=6.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=6.0", "pytest-cov>=2.0"]

[project.scripts]
assystant = "assystant.cli:main"

[tool.hatch.version]
path = "assystant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["assystant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
