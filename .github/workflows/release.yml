# Build and publish assystant to PyPI.
#
# - pull_request: build + `twine check` only (dry run, nothing is published).
# - release published: build, verify the release tag matches the package
#   version, then publish via PyPI trusted publishing (OIDC, no API token).
#
# Trusted publisher on PyPI: owner ligerzero-ai, repository assystant,
# workflow release.yml, environment pypi.

name: release

on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIST: assystant
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          wheel_version=$(basename "${wheels[0]}" | cut -d- -f2)
          meta_version=$(python - "${wheels[0]}" <<'PY'
          import sys, zipfile
          from email.parser import Parser
          with zipfile.ZipFile(sys.argv[1]) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              print(Parser().parsestr(zf.read(name).decode())["Version"])
          PY
          )
          if [ "$wheel_version" != "$meta_version" ]; then
            echo "::error::wheel filename version $wheel_version != METADATA version $meta_version"
            exit 1
          fi
          # Accept "v<ver>", "<dist>-<ver>" (underscore or hyphen spelling), or "<ver>".
          ver="$TAG"
          for prefix in "v" "${DIST}-" "${DIST//_/-}-"; do
            if [ "${ver#"$prefix"}" != "$ver" ]; then
              ver="${ver#"$prefix"}"
              break
            fi
          done
          if [ "$ver" != "$meta_version" ]; then
            echo "::error::release tag '$TAG' (version '$ver') does not match package version '$meta_version'"
            exit 1
          fi
          echo "Tag '$TAG' matches package version $meta_version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/assystant
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
